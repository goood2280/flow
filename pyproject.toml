# Standard Python packaging metadata for the Flow app.
#
# NOTE: `setup.py` in this repo is NOT a packaging file — it is a large
# self-contained installer bundle generated by `_build_setup.py` (it embeds
# the source tree as gzip+base64 blobs and preserves user data on re-run).
# Package metadata and dependency declarations live here instead so the two
# do not collide.
#
# Backend (Python) deps mirror `backend/requirements.txt`;
# dev deps mirror `backend/requirements-dev.txt`.
# The frontend (React + Vite) is managed separately via `frontend/package.json`.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow"
version = "9.4.0"
description = "Fab data analytics + plan-vs-actual tracking platform for semiconductor development/pilot process data, with an AI analysis layer (Flow-i)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "goood2280", email = "goood2280@gmail.com" }]
keywords = ["semiconductor", "fab", "analytics", "fastapi", "data-analysis"]

# Backend runtime dependencies — mirror backend/requirements.txt
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "polars>=0.20",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "xlrd>=2.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langsmith>=0.1",
]

[project.optional-dependencies]
# Dev/test deps — mirror backend/requirements-dev.txt
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/goood2280/flow#readme"
Repository = "https://github.com/goood2280/flow.git"
Issues = "https://github.com/goood2280/flow/issues"

[tool.setuptools]
# The distributable artifact is the self-contained setup.py bundle, not a
# wheel of importable top-level packages. Backend code lives under backend/.
packages = ["backend"]

[tool.setuptools.package-dir]
"" = "."
