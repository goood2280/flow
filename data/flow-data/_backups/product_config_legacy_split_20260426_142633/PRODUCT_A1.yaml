product: PRODUCT_A1
process_id: A1_MAIN
description: Product A1 ET/probe-card sample config
owner: et_team
canonical_knobs:
  - KNOB_GATE_MAIN
  - KNOB_M2_STACK
canonical_inline_items:
  - CD_POLY
  - THK_FILM
et_key_items:
  - Rc
  - Vth_n
  - Vth_p
  - Ioff_p
yld_metric: YIELD
perf_metric: Rc
target_spec:
  Rc: [0.7, 1.3, 1.0]
  Vth_n: [0.35, 0.75, 0.55]
probe_card_watch:
  enabled: true
  notify_admin: true
  items:
    - item_id: PC_RES
      alias: Probe Resistance
      step_ids: [ETA100020]
      step_seqs: ["0"]
      spec: usl
      usl: 0.23
      severity: critical
    - item_id: PC_OPEN
      alias: Probe Open
      step_ids: [ETA100020]
      step_seqs: ["0"]
      spec: usl
      usl: 0.09
      severity: critical
    - item_id: PC_ALIGN
      alias: Probe Align
      step_ids: [ETA100020]
      step_seqs: ["0"]
      spec: both
      lsl: -0.12
      usl: 0.12
      severity: warn
