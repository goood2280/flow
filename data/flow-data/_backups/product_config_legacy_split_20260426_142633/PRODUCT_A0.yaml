product: PRODUCT_A0
process_id: A0_MAIN
description: Product A0 ET/probe-card sample config
owner: et_team
canonical_knobs:
- KNOB_GATE_MAIN
- KNOB_M1_FILL
canonical_inline_items:
- CD_POLY
- THK_FILM
et_key_items:
- Rc
- Vth_n
- Vth_p
- Ioff_n
yld_metric: YIELD
perf_metric: Rc
target_spec:
  Rc:
  - 0.7
  - 1.3
  - 1.0
  Vth_n:
  - 0.35
  - 0.75
  - 0.55
probe_card_watch:
  enabled: true
  notify_admin: true
  items:
  - item_id: PC_RES
    alias: Probe Resistance
    step_ids:
    - ETA100010
    step_seqs:
    - '0'
    spec: usl
    usl: 0.22
    severity: critical
  - item_id: PC_OPEN
    alias: Probe Open
    step_ids:
    - ETA100010
    step_seqs:
    - '0'
    spec: usl
    usl: 0.08
    severity: critical
  - item_id: PC_ALIGN
    alias: Probe Align
    step_ids:
    - ETA100010
    step_seqs:
    - '0'
    spec: both
    lsl: -0.12
    usl: 0.12
    severity: warn
wafer_layout:
  waferRadius: 150.0
  wfCenterX: 0
  wfCenterY: 0
  refShotX: 0
  refShotY: 0
  refShotCenterX: 0
  refShotCenterY: 0
  shotPitchX: 28.0
  shotPitchY: 30.0
  shotSizeX: 27.2
  shotSizeY: 29.2
  tegSizeX: 1.2
  tegSizeY: 0.6
  chipWidth: 3.6
  chipHeight: 4.8
  chipCols: 4
  chipRows: 5
  offsetXMm: 0.1
  offsetYMm: -0.2
  edgeExclusionMm: 3.0
  scribePattern:
  - positionRow: 0
    type: full
  - positionRow: 1
    type: half
  - positionRow: 2
    type: full
  - positionRow: 3
    type: full
  - positionRow: 4
    type: half
  - positionRow: 5
    type: full
  teg_definitions:
  - id: NW
    label: NW
    dx_mm: -10.0
    dy_mm: 12.0
  - id: NC
    label: NC
    dx_mm: 0.0
    dy_mm: 12.0
  - id: NE
    label: NE
    dx_mm: 10.0
    dy_mm: 12.0
  tegs:
  - 'no': 1
    name: NW
    x: -10.0
    y: 12.0
    flat: 0
  - 'no': 2
    name: NC
    x: 0.0
    y: 12.0
    flat: 0
  - 'no': 3
    name: NE
    x: 10.0
    y: 12.0
    flat: 0
