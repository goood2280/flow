product: PRODUCT_B
process_id: B_MAIN
description: Product B ET/probe-card sample config
owner: et_team
canonical_knobs:
  - KNOB_CONTACT
  - KNOB_BACKEND
canonical_inline_items:
  - CD_CONTACT
  - THK_METAL
et_key_items:
  - Rc
  - Vth_n
  - Vth_p
  - lkg
yld_metric: YIELD
perf_metric: Rc
target_spec:
  Rc: [0.65, 1.35, 1.0]
  Vth_n: [0.32, 0.78, 0.55]
probe_card_watch:
  enabled: true
  notify_admin: true
  items:
    - item_id: PC_RES
      alias: Probe Resistance
      step_ids: [ETB100010]
      step_seqs: ["0"]
      spec: usl
      usl: 0.24
      severity: critical
    - item_id: PC_OPEN
      alias: Probe Open
      step_ids: [ETB100010]
      step_seqs: ["0"]
      spec: usl
      usl: 0.1
      severity: critical
    - item_id: PC_ALIGN
      alias: Probe Align
      step_ids: [ETB100010]
      step_seqs: ["0"]
      spec: both
      lsl: -0.14
      usl: 0.14
      severity: warn
